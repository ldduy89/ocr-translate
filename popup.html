<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 14px/1.4 system-ui, sans-serif; color: #111; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #555; margin-top: 10px; }
    select, input, button { width: 100%; margin-top: 4px; padding: 7px; font: inherit; box-sizing: border-box; }
    button { margin-top: 12px; background: #4da3ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" width="20" height="20" style="vertical-align:-4px;margin-right:6px">AI Image Translate</h1>
  <label for="targetLang">Dịch sang</label>
  <select id="targetLang"></select>
  <label for="geminiKey">Gemini API key</label>
  <input type="password" id="geminiKey" placeholder="AIza...">
  <button id="start">Chọn vùng để dịch</button>
  <button id="translateAll">Dịch tất cả ảnh trên trang</button>
  <script src="popup.js"></script>
</body>
</html>
